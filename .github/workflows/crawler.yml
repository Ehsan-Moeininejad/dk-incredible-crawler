name: Digikala Incredible Offers

on:
  # Times are UTC. Tehran is UTC+3:30 all year (Iran dropped DST in 2022).
  #
  #   20:33 UTC = 00:03 Tehran (next day)
  #   03:33 UTC = 07:03 Tehran
  #   09:33 UTC = 13:03 Tehran
  #   12:33 UTC = 16:03 Tehran
  #
  # Minute 33 is deliberate. GitHub's scheduler is busiest at :00 and :30, and
  # scheduled runs are delayed - sometimes dropped - during those spikes.
  # An odd minute off the peak is measurably more reliable, and three minutes
  # past the hour makes no difference to a snapshot that refreshes 4x a day.
  schedule:
    - cron: "33 20,3,9,12 * * *"

  # Lets you run it by hand from the Actions tab. Keep this -- it is how you
  # test the workflow without waiting for a scheduled slot.
  workflow_dispatch:

# Needed by the "Keep the repository active" step, which pushes a commit.
permissions:
  contents: write

# Never let two runs touch the sheet at the same time.
concurrency:
  group: dk-incredible-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report how this run was triggered
        run: |
          echo "event      : ${{ github.event_name }}"
          echo "started at : $(date -u '+%Y-%m-%d %H:%M UTC')  /  $(TZ=Asia/Tehran date '+%H:%M Tehran')"

      - name: Write the Google service-account key
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "::error::secret GOOGLE_CREDENTIALS is empty or not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json
          python -c "import json;json.load(open('credentials.json'));print('key file is valid JSON')"

      - name: Run the crawler
        run: python crawler.py

      - name: Remove the key file
        if: always()
        run: rm -f credentials.json

      # ---------------------------------------------------------------------
      # Keepalive.
      #
      # GitHub disables a public repository's scheduled workflows after 60 days
      # with no repository activity, and only emails you afterwards. Rewriting
      # and committing this one small file on every run means the repo is never
      # idle for more than a few hours, so that timer never gets close.
      #
      # Only a ~200 byte status file is committed, never the CSV: four commits
      # a day of a 400KB file would bloat the repository within months.
      #
      # A push made with GITHUB_TOKEN does not trigger workflows, so this
      # cannot loop back into another run.
      # ---------------------------------------------------------------------
      - name: Keep the repository active
        if: always()
        run: |
          rows=0
          if [ -f data/latest.csv ]; then
            rows=$(( $(wc -l < data/latest.csv) - 1 ))
          fi

          {
            echo "# Last run"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| when | $(TZ=Asia/Tehran date '+%Y-%m-%d %H:%M') Tehran · $(date -u '+%H:%M') UTC |"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| rows written | $rows |"
            echo "| result | ${{ job.status }} |"
            echo "| run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo
            echo "<!-- Rewritten by every run. Two jobs: a glanceable status, and a"
            echo "     commit often enough that GitHub never disables the schedule"
            echo "     for 60 days of repository inactivity. -->"
          } > LAST_RUN.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_RUN.md

          if git diff --staged --quiet; then
            echo "LAST_RUN.md unchanged - nothing to commit"
            exit 0
          fi

          git commit -m "run $(TZ=Asia/Tehran date '+%Y-%m-%d %H:%M') Tehran - $rows rows"
          git push || (git pull --rebase && git push)

      - name: Keep the CSV as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incredible-offers-csv
          path: data/latest.csv
          retention-days: 7
          if-no-files-found: warn

      - name: Show the log on failure
        if: failure()
        run: tail -40 logs/crawler.log || true
